<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="style.css"/>
    <title>JeweryShop - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .register-form  {
            max-height: 80vh; /* Позволява скрол в рамките на 80% от височината на екрана */
            overflow-y: auto; /* Активира вертикален скрол */
            padding: 20px;
        }
    </style>
</head>
<body>
    <!-- Прозрачен фон за модала -->
    <div class="overlay" id="overlay" onclick="hideRegisterForm()"></div>
    
    <!-- Registration Form -->
    <form class="register-form " id="registerForm">
        <a class="return-home-page" href="index.html">Home page</a>
        
        <h1>Register</h1>
        <h2>Create an account</h2>
        
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
        
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required>
        
        <!-- Button container -->
        <div class="button-container">
            <button type="submit" class="order-button">Register</button>
            <button type="button" class="order-button" id="cancel-register">Cancel</button>
        </div>
        
        <p>Already have an account? <a href="login.html">Login here</a></p>
    </form>
    
    
    <script src="script.js"></script>
</body>
</html>
