<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" type="text/css" href="style.css" />
  <link rel="icon" href="images/icon.png" type="image/png">
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    .admin-form {
       
  max-height: 100vh; 
  overflow-y: auto;
  padding: 10px;
}

</style>
</head>
<body>
    <div class="overlay" id="overlay" onclick="hideAdminForm()"></div>

    <!-- Admin Panel Form -->
    <form class="admin-form" id="adminForm">
        <h2>Admin Panel</h2>
        <h3>Add Item</h3>
    

            
            <!-- Полета за добавяне на нов елемент -->
            <label for="nameJewelry">Name of Jewelry</label>
            <input type="text" id="nameJewelry" name="nameJewelry"  required>

            <label for="price">Price</label>
            <input type="number" id="price" name="price" step="0.01"  required>

            <label for="image">Image URL</label>
            <input type="text" id="image" name="image"  required>

            <label for="shortDescription">Short Description</label>
            <textarea id="shortDescription" name="shortDescription" placeholder=" (max 100 characters)" required maxlength="100"></textarea>

            <label for="fullDescription">Full Description</label>
            <textarea id="fullDescription" name="fullDescription"  required></textarea>

            <!-- Бутон за добавяне на новия елемент -->
            <div class="button-container">
                <button type="submit" class="order-button">Submit</button>
            </div>

            <!-- Секция за съществуващи елементи -->
            <div class="item-container">
                <h3>Existing Items</h3>
                <div id="item-list">
                    <!-- Items will be dynamically added here -->
                </div>
            </div>
        
    </form>

    <script src="script.js"></script>
</body>
</html>
