<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <link rel="stylesheet" type="text/css" href="style.css" />
  <link rel="icon" href="images/icon.png" type="image/png">
  <title>Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>

  <!-- ... останалите head елементи ... -->
  <style>
    .admin-panel-container {
      display: flex;
      margin-top: 65px;
      padding: 20px;
      gap: 20px;
    }

    .admin-form-container {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    .admin-products-container {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-height: calc(100vh - 105px);
      overflow-y: auto;
    }

    .admin-form {
      width: 100%;
    }

    /* Респонсив дизайн за малки екрани */
    @media (max-width: 900px) {
      .admin-panel-container {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="header-container">
    <!-- ... навигация ... -->
  </div>

  <div class="admin-panel-container">
    <!-- Форма за добавяне/редактиране -->
    <div class="admin-form-container">
      <form class="admin-form" id="adminForm">
        <h2>Admin Panel</h2>
        <h3>Manage Product</h3>
        
        <!-- Полетата остават същите -->
        <label for="nameJewelry">Name of Jewelry</label>
        <input type="text" id="nameJewelry" name="nameJewelry" required>
        <!-- ... останали полета ... -->
        
        <div class="button-container">
          <button type="button" class="order-button" onclick="loadProduct()">Load by ID</button>
          <button type="button" class="order-button" onclick="deleteProduct()">Delete</button>
          <button type="submit" class="order-button">Save</button>
        </div>
      </form>
    </div>

    <!-- Секция за съществуващи продукти -->
    <div class="admin-products-container">
      <h3>Existing Products</h3>
      <div id="item-list">
        <!-- Продуктите ще се показват тук -->
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
